<!doctype html>
<html lang="zh-Hant">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1">
<title>跳跳月曆</title>
<!--
  跳跳月曆：在月曆上找星期、數日子的小遊戲
  - 單一 HTML 檔，完全離線可用，不引用任何外部資源
  - 小青蛙「跳跳」、活動貼紙等所有圖案皆為原創 SVG 向量圖
  - 最佳紀錄只存在本機瀏覽器，不蒐集任何個人資料
-->
<style>
:root{
  --cork:#c99c6b; --cork-d:#a8794a; --cork-l:#dcb486;
  --paper:#fffefa; --line:#e7e1d6; --ink:#22313d; --muted:#6b7680;
  --sun:#d93636; --sat:#2667a8; --tape:#f5d35a; --tape2:#9fd3c7;
  --frog:#5cb24c; --frog-d:#3c8a30; --hl:#fff1a8; --good:#2f8a4f; --warm:#d9731a;
}
*{box-sizing:border-box; -webkit-tap-highlight-color:transparent}
html,body{margin:0; min-height:100%}
body{
  color:var(--ink);
  font-family:system-ui,-apple-system,"PingFang TC","Microsoft JhengHei","Noto Sans TC",sans-serif;
  background:
    radial-gradient(circle at 20% 30%, rgba(120,80,40,.28) 1.2px, transparent 1.6px) 0 0/11px 13px,
    radial-gradient(circle at 70% 60%, rgba(255,230,190,.35) 1.2px, transparent 1.7px) 0 0/15px 9px,
    var(--cork);
  user-select:none; -webkit-user-select:none;
}
button{font:inherit; color:inherit; cursor:pointer; touch-action:manipulation}
button:focus-visible{outline:3px solid var(--sat); outline-offset:3px}
[hidden]{display:none !important}
#app{max-width:1060px; margin:0 auto; padding:14px 16px 28px; min-height:100vh; display:flex; flex-direction:column}
.screen{display:none; flex:1; flex-direction:column}
.screen.active{display:flex}

/* ---------- 紙張、紙膠帶、圖釘 ---------- */
.sheet{position:relative; background:var(--paper); border-radius:4px; box-shadow:0 2px 0 rgba(0,0,0,.08), 0 10px 22px rgba(60,35,10,.28)}
.tape{position:absolute; top:-12px; width:92px; height:26px; background:var(--tape); opacity:.88; transform:rotate(-4deg); left:calc(50% - 46px)}
.tape.b{background:var(--tape2); transform:rotate(3deg)}
.pin{position:absolute; top:10px; width:18px; height:18px; border-radius:50%; background:radial-gradient(circle at 35% 35%, #ff8f8f, #c42424 70%); box-shadow:2px 3px 0 rgba(0,0,0,.25)}

/* ---------- 標題 ---------- */
.title{align-self:center; padding:16px 30px 12px; margin:10px 0 18px; text-align:center; transform:rotate(-1.5deg)}
.title h1{margin:0; font-size:clamp(32px,8.5vw,46px); letter-spacing:4px; line-height:1.15}
.title p{margin:4px 0 0; font-size:16px; font-weight:700; color:var(--muted)}
.title .frog-mini{position:absolute; right:-26px; bottom:-14px; width:64px}

/* ---------- 按鈕：便利貼 ---------- */
.note-btn{
  border:none; border-radius:3px; background:#fff59d; padding:12px 16px; font-weight:900;
  box-shadow:0 3px 0 rgba(0,0,0,.12), 0 6px 12px rgba(60,35,10,.22);
  transition:transform .08s;
}
.note-btn:active{transform:translateY(3px) scale(.98)}
.note-btn.green{background:#bfe8a8} .note-btn.blue{background:#bfe0f5} .note-btn.pink{background:#ffd3dc}
.note-btn.small{font-size:15px; padding:8px 12px}

/* ---------- 首頁 ---------- */
.home-grid{display:grid; grid-template-columns:1fr; gap:22px; align-items:start}
.levels{padding:22px 18px 18px}
.levels h2{margin:0 0 12px; font-size:19px}
.lv{display:flex; align-items:center; gap:12px; width:100%; text-align:left; margin-bottom:12px; padding:12px 14px; font-size:16px}
.lv .t{font-size:21px; font-weight:900; display:block}
.lv .d{font-size:14px; font-weight:700; color:#5a5040; display:block; margin-top:2px}
.lv .best{margin-left:auto; font-size:15px; color:#b57d00; white-space:nowrap}
.lv[aria-pressed="true"]{outline:4px solid var(--frog-d); outline-offset:2px}
.lv:nth-of-type(1){transform:rotate(-.8deg)} .lv:nth-of-type(2){transform:rotate(.6deg)} .lv:nth-of-type(3){transform:rotate(-.4deg)}
.start{width:100%; font-size:23px; padding:15px; margin-top:6px}
.toggles{display:flex; gap:12px; justify-content:center; margin-top:16px; flex-wrap:wrap}
.preview{padding:26px 12px 12px}

/* ---------- 月曆 ---------- */
.cal{padding:30px 10px 12px}
.rings{position:absolute; top:-10px; left:0; right:0; display:flex; justify-content:space-around; padding:0 26px}
.rings i{width:10px; height:26px; border-radius:6px; background:linear-gradient(90deg,#7d8790,#d6dde3 45%,#7d8790); border:1.5px solid #4e5961}
.cal-head{display:flex; align-items:baseline; justify-content:center; gap:10px; margin:0 0 8px}
.cal-head .m{font-size:clamp(30px,8vw,40px); font-weight:900; color:var(--ink)}
.cal-head .y{font-size:16px; font-weight:800; color:var(--muted)}
.grid-wrap{position:relative}
.grid{display:grid; grid-template-columns:repeat(7,1fr); gap:3px}
.wd{text-align:center; font-weight:900; font-size:15px; padding:5px 0; border-radius:6px; background:#f1ede4}
.wd.sun{color:var(--sun)} .wd.sat{color:var(--sat)}
.cell{position:relative; aspect-ratio:1 / 1; min-height:40px; border:1.5px solid var(--line); border-radius:6px; background:#fff; padding:3px 4px; text-align:left; transition:background .2s}
.cell .n{font-size:clamp(13px,3.4vw,17px); font-weight:900; line-height:1}
.cell.sun .n{color:var(--sun)} .cell.sat .n{color:var(--sat)}
.cell.blank{border:none; background:transparent}
.cell .stk{position:absolute; right:3px; bottom:3px; width:58%; height:58%}
.cell .stk svg{width:100%; height:100%; display:block; filter:drop-shadow(0 1.5px 0 rgba(0,0,0,.18))}
.cell .bdg{position:absolute; left:3px; bottom:3px; min-width:22px; height:22px; padding:0 4px; border-radius:11px;
  background:var(--frog-d); color:#fff; font-size:14px; font-weight:900; display:flex; align-items:center; justify-content:center; z-index:2; box-shadow:0 2px 0 rgba(0,0,0,.2)}
.cell.hl{background:var(--hl)}
.wd.hl{background:#ffe066}
.cell.ring{box-shadow:0 0 0 3px var(--warm) inset}
.cell.right{background:#c9efc9; box-shadow:0 0 0 3px var(--good) inset}
.cell.wrong{background:#fde2c6}
.grid.tap .cell:not(.blank){cursor:pointer}
.grid.tap .cell:not(.blank):hover{background:#f4fbef}
.frog{position:absolute; width:13%; pointer-events:none; z-index:3; transition:left .28s ease, top .28s ease; transform:translate(-8%,-34%)}
.frog svg{width:100%; display:block}
.frog.hop{animation:hop .28s ease}
@keyframes hop{50%{transform:translate(-8%,-74%)}}

/* ---------- 遊戲 ---------- */
.bar{display:flex; align-items:center; justify-content:space-between; gap:8px 10px; flex-wrap:wrap; margin-bottom:16px}
.dots{display:flex; gap:4px}
.dots i{width:12px; height:12px; border-radius:50%; background:#fff; border:2px solid var(--ink); display:block; flex-shrink:0}
.dots i.ok{background:var(--good)} .dots i.half{background:var(--tape)} .dots i.miss{background:#cfc6b8} .dots i.now{background:#ffd3dc}
.play{display:grid; grid-template-columns:1fr; gap:22px; align-items:start}
.qcard{padding:22px 16px 16px; text-align:center}
.q{font-size:20px; font-weight:900; line-height:1.6; margin:0 0 14px}
.ev{display:inline-flex; align-items:center; gap:4px; padding:0 8px 0 4px; border-radius:999px; background:#f6f1e6; white-space:nowrap}
.ev svg{width:24px; height:24px; flex-shrink:0}
.wds{display:grid; grid-template-columns:repeat(7,1fr); gap:6px}
.wds button{padding:10px 0; font-size:17px; font-weight:900; border-radius:8px; border:2px solid var(--ink); background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.18)}
.wds button.sun{color:var(--sun)} .wds button.sat{color:var(--sat)}
.wds button small{display:block; font-size:11px; font-weight:800; color:var(--muted)}
.nums{display:grid; grid-template-columns:repeat(4,1fr); gap:8px}
.nums button{padding:12px 0; font-size:22px; font-weight:900; border-radius:8px; border:2px solid var(--ink); background:#fff; box-shadow:0 3px 0 rgba(0,0,0,.18)}
.wds button:active,.nums button:active{transform:translateY(2px); box-shadow:0 1px 0 rgba(0,0,0,.18)}
.wds button.right,.nums button.right{background:var(--good); color:#fff}
.wds button.wrong,.nums button.wrong{background:#fde2c6; opacity:.7}
.tapnote{font-size:16px; font-weight:800; color:var(--frog-d); margin:0}
.feedback{min-height:30px; font-size:21px; font-weight:900; margin-top:12px}
.feedback.good{color:var(--good)} .feedback.warm{color:var(--warm)}
.hint{margin-top:8px; font-size:17px; font-weight:700; line-height:1.7; text-align:left; background:#f6f1e6; border-radius:8px; padding:10px 12px}
.hint:empty{display:none}
.next{margin-top:14px; font-size:19px}

/* ---------- 結果 ---------- */
.result{max-width:520px; margin:24px auto 0; width:100%; padding:30px 20px 20px; text-align:center}
.stars{display:flex; justify-content:center; gap:8px}
.stars svg{width:54px; height:54px}
.r-title{font-size:30px; font-weight:900; margin:6px 0}
.r-line{font-size:18px; font-weight:800; color:var(--muted)}
.r-frog{width:110px; margin:6px auto 0}
.r-btns{display:flex; gap:12px; margin-top:22px}
.r-btns .note-btn{flex:1; font-size:19px}

/* ---------- 注音（直式，跟國語課本一樣） ---------- */
.zc{display:inline-flex; align-items:center; white-space:nowrap; text-indent:0}
.zp{position:relative; display:inline-flex; flex-direction:column; align-items:center; justify-content:center;
  font-size:max(.32em, 8px); line-height:1.05; letter-spacing:0; margin:0 .6em 0 .12em; font-weight:700}
.zp i{display:block; font-style:normal}
.zp .tn{position:absolute; left:100%; bottom:.15em; margin-left:.05em}
.zp .lt{position:absolute; top:-.9em; left:0; right:0; text-align:center}
body.zy-on .hint, body.zy-on .q{line-height:2.2}
body.zy-on .wds button{font-size:15px}

@media (min-width:860px){
  .home-grid{grid-template-columns:1.15fr 1fr; gap:30px}
  .play{grid-template-columns:1.2fr 1fr; gap:30px}
}
@media (prefers-reduced-motion: reduce){
  *,*::before,*::after{animation:none !important; transition:none !important}
}
</style>
</head>
<body>
<div id="app">

  <!-- 首頁 -->
  <section id="home" class="screen active">
    <div class="sheet title"><span class="tape"></span><h1 data-zy="">跳跳月曆</h1><p data-zy="">跟小青蛙一起看月曆</p><div class="frog-mini" id="titleFrog"></div></div>
    <div class="home-grid">
      <div class="sheet cal preview" id="previewCal"></div>
      <div class="sheet levels">
        <span class="pin" style="left:14px"></span><span class="pin" style="right:14px"></span>
        <h2 data-zy="">選難度</h2>
        <div id="levelOpts"></div>
        <button class="note-btn green start" id="startBtn" data-zy="">開始</button>
        <div class="toggles">
          <button class="note-btn small blue" id="soundBtn"></button>
          <button class="note-btn small pink" id="zyBtn"></button>
        </div>
      </div>
    </div>
  </section>

  <!-- 遊戲 -->
  <section id="game" class="screen">
    <div class="bar">
      <button class="note-btn small" id="backBtn" data-zy="">回首頁</button>
      <div class="dots" id="dots"></div>
    </div>
    <div class="play">
      <div class="sheet cal" id="gameCal"></div>
      <div class="sheet qcard">
        <span class="tape b"></span>
        <p class="q" id="qText"></p>
        <div class="wds" id="wdBtns" hidden></div>
        <div class="nums" id="numBtns" hidden></div>
        <p class="tapnote" id="tapNote" hidden></p>
        <div class="feedback" id="feedback"></div>
        <div class="hint" id="hint"></div>
        <button class="note-btn green next" id="nextBtn" hidden></button>
      </div>
    </div>
  </section>

  <!-- 結果 -->
  <section id="result" class="screen">
    <div class="sheet result" id="resultBox"></div>
  </section>
</div>

<script>
/* =====================================================================
   設定區
   ===================================================================== */
const TOTAL = 10;
const LEVELS = {
  easy: { name:'簡單', desc:'找星期、找第一個星期幾、跳 1～3 天' },
  mid:  { name:'進階', desc:'第幾個星期幾、跳更多天、算還要幾天' },
  hard: { name:'困難', desc:'往前跳、往回跳、最後一個星期幾' }
};
const EVENTS = [
  { k:'cake',  name:'生日派對', c:'#ff6f91' },
  { k:'kite',  name:'放風箏',   c:'#2a9df4' },
  { k:'ball',  name:'踢足球',   c:'#3c8a30' },
  { k:'book',  name:'去圖書館', c:'#8a5cf0' },
  { k:'fish',  name:'去釣魚',   c:'#14a3b3' },
  { k:'music', name:'音樂會',   c:'#f08c00' }
];
const WD = ['日','一','二','三','四','五','六'];
const PRAISE  = ['呱呱！答對了！','太棒了！','你是月曆小偵探！','完全正確！'];
const COMFORT = ['沒關係！','差一點點！','加油，你可以的！','再看一次！'];

/* ===== 小工具 ===== */
const $ = function(id){ return document.getElementById(id); };
function pick(a){ return a[Math.floor(Math.random()*a.length)]; }
function randInt(a,b){ return a + Math.floor(Math.random()*(b-a+1)); }
function shuffle(a){ for(let i=a.length-1;i>0;i--){ const j=Math.floor(Math.random()*(i+1)); const t=a[i]; a[i]=a[j]; a[j]=t; } return a; }
function show(id){ document.querySelectorAll('.screen').forEach(function(s){ s.classList.toggle('active', s.id===id); }); window.scrollTo(0,0); }
function wdName(i){ return '星期' + WD[i]; }
const reduceMotion = window.matchMedia && window.matchMedia('(prefers-reduced-motion: reduce)').matches;

const store = (function(){
  try{ const s = JSON.parse(localStorage.getItem('hop-calendar')); if(s) return s; }catch(e){}
  return { level:'easy', zhuyin:false, best:{} };
})();
function save(){ try{ localStorage.setItem('hop-calendar', JSON.stringify(store)); }catch(e){} }

/* =====================================================================
   原創圖案：小青蛙「跳跳」與活動貼紙
   ===================================================================== */
function frogSVG(){
  return '<svg viewBox="0 0 64 54" aria-hidden="true">'
    + '<ellipse cx="32" cy="50" rx="20" ry="3.5" fill="#000" opacity=".12"/>'
    + '<path d="M10 46 q-6 0 -6 -5 q4 1 9 -1z M54 46 q6 0 6 -5 q-4 1 -9 -1z" fill="#3c8a30"/>'
    + '<ellipse cx="32" cy="34" rx="22" ry="15" fill="#5cb24c" stroke="#22313d" stroke-width="2.4"/>'
    + '<ellipse cx="32" cy="39" rx="13" ry="8" fill="#d8f0b8"/>'
    + '<circle cx="20" cy="18" r="9" fill="#5cb24c" stroke="#22313d" stroke-width="2.4"/><circle cx="44" cy="18" r="9" fill="#5cb24c" stroke="#22313d" stroke-width="2.4"/>'
    + '<circle cx="20" cy="18" r="5.5" fill="#fff"/><circle cx="44" cy="18" r="5.5" fill="#fff"/>'
    + '<circle cx="21" cy="19" r="3" fill="#22313d"/><circle cx="45" cy="19" r="3" fill="#22313d"/>'
    + '<circle cx="22" cy="17.6" r="1.1" fill="#fff"/><circle cx="46" cy="17.6" r="1.1" fill="#fff"/>'
    + '<path d="M24 31 q8 7 16 0" fill="none" stroke="#22313d" stroke-width="2.4" stroke-linecap="round"/>'
    + '<circle cx="16" cy="30" r="3" fill="#ff8fa3" opacity=".7"/><circle cx="48" cy="30" r="3" fill="#ff8fa3" opacity=".7"/>'
    + '</svg>';
}
function iconSVG(k){
  const e = EVENTS.filter(function(x){ return x.k===k; })[0], c = e.c, o = 'stroke="#22313d" stroke-width="1.8" stroke-linejoin="round"';
  const bg = '<circle cx="16" cy="16" r="15" fill="#fff" '+o+'/>';
  const body = {
    cake:  '<rect x="8" y="16" width="16" height="9" rx="2" fill="'+c+'" '+o+'/><path d="M8 19 q2 2 4 0 q2 2 4 0 q2 2 4 0 q2 2 4 0" fill="none" stroke="#fff" stroke-width="1.6"/><rect x="15" y="9.5" width="2.4" height="6.5" fill="#ffd34d" '+o+'/><path d="M16.2 5 q2.5 3 0 4.6 q-2.5 -1.6 0 -4.6z" fill="#ff8a00"/>',
    kite:  '<path d="M16 5 L24 14 L16 23 L8 14 Z" fill="'+c+'" '+o+'/><path d="M16 5 V23 M8 14 H24" stroke="#fff" stroke-width="1.4"/><path d="M16 23 q-3 3 0 5 q3 2 0 4" fill="none" stroke="#22313d" stroke-width="1.5"/>',
    ball:  '<circle cx="16" cy="16" r="9" fill="#fff" '+o+'/><path d="M16 11.5 l4 3 -1.5 4.6 h-5 l-1.5 -4.6z" fill="'+c+'" '+o+'/>',
    book:  '<path d="M6 10 q5 -2 10 1 v13 q-5 -3 -10 -1z" fill="'+c+'" '+o+'/><path d="M26 10 q-5 -2 -10 1 v13 q5 -3 10 -1z" fill="#c9b8ff" '+o+'/>',
    fish:  '<path d="M6 16 q8 -9 17 0 q-9 9 -17 0z" fill="'+c+'" '+o+'/><path d="M23 16 l4 -4 v8z" fill="'+c+'" '+o+'/><circle cx="11" cy="15" r="1.4" fill="#22313d"/>',
    music: '<path d="M13 22 V9 l9 -2 v12" fill="none" stroke="#22313d" stroke-width="2.2" stroke-linecap="round"/><ellipse cx="10.5" cy="22" rx="3.6" ry="2.8" fill="'+c+'" '+o+'/><ellipse cx="19.5" cy="19" rx="3.6" ry="2.8" fill="'+c+'" '+o+'/>'
  }[k];
  return '<svg viewBox="0 0 32 32" aria-hidden="true">'+bg+body+'</svg>';
}
function evTag(e){ return '<span class="ev">'+iconSVG(e.k)+'「'+e.name+'」</span>'; }
function starSVG(on){ return '<svg viewBox="0 0 24 24"><path d="M12 2.2l2.95 6.1 6.7.85-4.95 4.6 1.3 6.65L12 17.1l-5.95 3.3 1.3-6.65L2.4 9.15l6.7-.85z" fill="'+(on?'#f5c518':'#e7e1d6')+'" stroke="#22313d" stroke-width="1.6" stroke-linejoin="round"/></svg>'; }

/* ===== 音效 ===== */
let ac = null, soundOn = true;
function tone(freqs, dur, type, gap){
  if(!soundOn) return;
  try{
    ac = ac || new (window.AudioContext || window.webkitAudioContext)();
    freqs.forEach(function(f,i){
      const o = ac.createOscillator(), g = ac.createGain(), t = ac.currentTime + i*(gap||dur);
      o.type = type||'sine'; o.frequency.value = f;
      g.gain.setValueAtTime(0.0001, t); g.gain.exponentialRampToValueAtTime(0.2, t+0.015); g.gain.exponentialRampToValueAtTime(0.0001, t+dur);
      o.connect(g); g.connect(ac.destination); o.start(t); o.stop(t+dur+0.02);
    });
  }catch(e){}
}
function sGood(){ tone([523,659,784], 0.12, 'triangle'); }
function sSoft(){ tone([392,349], 0.14, 'triangle'); }
function sHop(n){ tone([500 + n*40], 0.07, 'square'); }

/* =====================================================================
   注音：ZY 由產生器填入（臺灣國語課本讀音），破音字依詞語另外標
   ===================================================================== */

const ZY_WORDS = {"那裡": ["ㄋㄚˋ", "˙ㄌㄧ"], "關係": ["ㄍㄨㄢ", "˙ㄒㄧ"], "起來": ["ㄑㄧˇ", "˙ㄌㄞ"]};
function rubyOf(c, z){
  let light = false, tn = '';
  if(z.charAt(0)==='˙'){ light = true; z = z.slice(1); }
  if('ˊˇˋ'.indexOf(z.charAt(z.length-1)) >= 0){ tn = z.charAt(z.length-1); z = z.slice(0,-1); }
  let col = '';
  for(let k=0;k<z.length;k++) col += '<i>'+z.charAt(k)+'</i>';
  return '<span class="zc">'+c+'<span class="zp">'+(light?'<i class="lt">˙</i>':'')+col+(tn?'<i class="tn">'+tn+'</i>':'')+'</span></span>';
}
function zy(str){
  return String(str).split(/(<[^>]*>)/).map(function(part){
    if(part.charAt(0)==='<') return part;
    let out = '', i = 0;
    while(i < part.length){
      let hit = null;
      for(const w in ZY_WORDS){ if(part.substr(i,w.length)===w){ hit = w; break; } }
      if(hit){ for(let k=0;k<hit.length;k++) out += rubyOf(hit[k], ZY_WORDS[hit][k]); i += hit.length; continue; }
      const c = part[i]; out += ZY[c] ? rubyOf(c, ZY[c]) : c; i++;
    }
    return out;
  }).join('');
}
function Z(str){ return store.zhuyin ? zy(str) : str; }
function applyStaticZy(){
  document.querySelectorAll('[data-zy]').forEach(function(el){
    if(!el.dataset.zy) el.dataset.zy = el.textContent.trim();

function monthInfo(y, m){ return { y:y, m:m, first:new Date(y, m, 1).getDay(), days:new Date(y, m+1, 0).getDate() }; }
function wdOf(M, d){ return (M.first + d - 1) % 7; }

/* 畫出一整個月；events: { 日期: 活動 } */
function calHTML(M, events){
  let g = '';
  for(let i=0;i<7;i++) g += '<div class="wd'+(i===0?' sun':i===6?' sat':'')+'" data-wd="'+i+'">'+Z(WD[i])+'</div>';
  for(let i=0;i<M.first;i++) g += '<div class="cell blank"></div>';
  for(let d=1; d<=M.days; d++){
    const w = wdOf(M,d), e = events[d];
    g += '<div class="cell'+(w===0?' sun':w===6?' sat':'')+'" data-d="'+d+'"><span class="n">'+d+'</span>'
       + (e ? '<span class="stk">'+iconSVG(e.k)+'</span>' : '') + '</div>';
  }
  return '<div class="rings">'+'<i></i>'.repeat(7)+'</div>'
    + '<div class="cal-head"><span class="m">'+Z((M.m+1)+' 月')+'</span><span class="y">'+Z(M.y+' 年')+'</span></div>'
    + '<div class="grid-wrap"><div class="grid">'+g+'</div><div class="frog" hidden>'+frogSVG()+'</div></div>';
}

/* 跳跳站到某一天 */
function placeFrog(box, d, hop){
  const frog = box.querySelector('.frog'), cell = box.querySelector('[data-d="'+d+'"]');
  if(!frog || !cell) return;
  frog.hidden = false;
  frog.style.left = cell.offsetLeft + 'px';
  frog.style.top = cell.offsetTop + 'px';
  frog.style.width = (cell.offsetWidth * 0.82) + 'px';
  if(hop && !reduceMotion){ frog.classList.remove('hop'); void frog.offsetWidth; frog.classList.add('hop'); }
}

/* =====================================================================
   出題
   ===================================================================== */
let level, M, events, evList, qi, q, results, locked, timers = [], lastMonth = -1;
function later(fn, ms){ timers.push(setTimeout(fn, ms)); }
function clearTimers(){ timers.forEach(clearTimeout); timers = []; }
const box = $('gameCal');

/* 每 3 題換一個月，月曆上貼 5 張活動貼紙 */
function newMonth(){
  let m;
  do{ m = randInt(0, 11); }while(m === lastMonth);
  lastMonth = m;
  M = monthInfo(new Date().getFullYear(), m);
  const days = shuffle(Array.from({ length:M.days }, function(_, i){ return i+1; })).slice(0, 5).sort(function(a,b){ return a-b; });
  const evs = shuffle(EVENTS.slice()).slice(0, 5);
  events = {}; evList = [];
  days.forEach(function(d, i){ events[d] = evs[i]; evList.push({ d:d, e:evs[i] }); });
}

/* 題型：weekday（某天星期幾）、nth（第幾個星期幾是幾號）、hop（跳幾天）、gap（還要幾天） */
function makeQ(){
  const types = level==='easy' ? ['weekday','weekday','nth','hop'] : level==='mid' ? ['weekday','nth','hop','hop','gap'] : ['nth','hop','hop','gap','weekday'];
  for(let tries=0; tries<80; tries++){
    const type = pick(types);
    if(type==='weekday'){
      const x = pick(evList);
      return { type:type, kind:'wd', d:x.d, ev:x.e, answer:wdOf(M,x.d),
        text:evTag(x.e)+' 那天是星期幾？' };
    }
    if(type==='nth'){
      const w = randInt(0,6), firstD = ((w - M.first + 7) % 7) + 1;
      const list = []; for(let d=firstD; d<=M.days; d+=7) list.push(d);
      if(level==='hard' && Math.random()<0.5){
        return { type:type, kind:'cell', w:w, list:list, n:list.length, last:true, answer:list[list.length-1],
          text:'這個月<b>最後一個'+wdName(w)+'</b>是幾號？在月曆上點點看' };
      }
      const n = level==='easy' ? 1 : randInt(1, Math.min(4, list.length));
      return { type:type, kind:'cell', w:w, list:list, n:n, answer:list[n-1],
        text:'這個月<b>第 '+n+' 個'+wdName(w)+'</b>是幾號？在月曆上點點看' };
    }
    if(type==='hop'){
      const x = pick(evList);
      let k = level==='easy' ? randInt(1,3) : level==='mid' ? randInt(2,9) : randInt(3,15);
      const back = level==='hard' && Math.random()<0.4;
      const to = back ? x.d - k : x.d + k;
      if(to < 1 || to > M.days) continue;
      const askDate = level!=='easy' && Math.random()<0.4;
      return { type:type, kind:askDate?'cell':'wd', from:x.d, ev:x.e, k:k, back:back, to:to, answer:askDate ? to : wdOf(M,to),
        text:'跳跳在'+evTag(x.e)+'那天，<b>'+(back?'往回':'往前')+'跳 '+k+' 天</b>，會跳到'+(askDate?'幾號？在月曆上點點看':'星期幾？') };
    }
    if(type==='gap'){
      const a = pick(evList), b = pick(evList);
      if(b.d <= a.d) continue;
      const gap = b.d - a.d;
      if(level==='mid' && gap > 10) continue;
      return { type:type, kind:'num', a:a, b:b, answer:gap,
        text:'從'+evTag(a.e)+'到'+evTag(b.e)+'，還要<b>過幾天</b>？' };
    }
  }
  const x = evList[0];
  return { type:'weekday', kind:'wd', d:x.d, ev:x.e, answer:wdOf(M,x.d), text:evTag(x.e)+' 那天是星期幾？' };
}

function startGame(){
  level = store.level; qi = 0; results = []; clearTimers();

function renderDots(){
  let s = '';

  $('dots').innerHTML = s;

function nextQ(){
  clearTimers();
  if(qi >= TOTAL){ finish(); return; }
  if(qi % 3 === 0) newMonth();
  q = makeQ(); q.retry = false; locked = false;
  box.innerHTML = calHTML(M, events);
  box.querySelector('.grid').classList.toggle('tap', q.kind==='cell');
  box.querySelectorAll('.cell:not(.blank)').forEach(function(c){ c.onclick = function(){ answer(+c.dataset.d, c); }; });
  if(q.type==='hop') later(function(){ placeFrog(box, q.from, true); }, 60);
  $('qText').innerHTML = Z(q.text);
  $('wdBtns').hidden = q.kind!=='wd'; $('numBtns').hidden = q.kind!=='num'; $('tapNote').hidden = q.kind!=='cell';
  if(q.kind==='wd'){
    $('wdBtns').innerHTML = WD.map(function(w,i){ return '<button class="'+(i===0?'sun':i===6?'sat':'')+'" data-v="'+i+'">'+Z('<small>星期</small>'+w)+'</button>'; }).join('');
    Array.from($('wdBtns').children).forEach(function(b){ b.onclick = function(){ answer(+b.dataset.v, b); }; });
  }else if(q.kind==='num'){
    const set = new Set([q.answer]);
    shuffle([q.answer+1, q.answer-1, q.answer+7, q.answer-7, q.answer+2, q.b.d, q.answer+3]).forEach(function(v){ if(set.size<4 && v>0) set.add(v); });
    while(set.size<4) set.add(randInt(1,20));
    $('numBtns').innerHTML = shuffle(Array.from(set)).map(function(v){ return '<button data-v="'+v+'">'+v+'</button>'; }).join('');

  $('hint').innerHTML = ''; $('nextBtn').hidden = true;
  renderDots();
}

/* 有沒有跨到另一排（另一個星期）？有的話多說一句 */
function rowOf(d){ return Math.floor((M.first + d - 1) / 7); }
function wrapNote(a, b){
  if(rowOf(a) === rowOf(b)) return '';
  return b > a ? '星期六的下一天是星期日，所以要換到下一排的最前面喔！' : '星期日的前一天是星期六，所以要回到上一排的最後面喔！';
}
function cellOf(d){ return box.querySelector('[data-d="'+d+'"]'); }
function clearMarks(){
  box.querySelectorAll('.hl,.ring,.wrong').forEach(function(el){ el.classList.remove('hl','ring','wrong'); });
  box.querySelectorAll('.bdg').forEach(function(el){ el.remove(); });
}
function badge(d, text){ const c = cellOf(d); if(c){ const b = document.createElement('span'); b.className = 'bdg'; b.textContent = text; c.appendChild(b); } }
function lightColumn(w){
  box.querySelector('.wd[data-wd="'+w+'"]').classList.add('hl');
  for(let d=1; d<=M.days; d++) if(wdOf(M,d)===w) cellOf(d).classList.add('hl');
}

/* 跳跳一格一格跳，邊跳邊數 */
function hopAnim(from, to, done){
  const dir = to >= from ? 1 : -1;
  placeFrog(box, from, false);
  let step = 0;
  (function go(){
    if(from + dir*step === to){ if(done) done(); return; }
    step++;
    const prev = from + dir*(step-1), d = from + dir*step;
    const wrap = (dir > 0 && wdOf(M,prev) === 6) || (dir < 0 && wdOf(M,prev) === 0);
    if(wrap && !reduceMotion){
      /* 換行：從這一排的邊邊跳出去，再從下一排（或上一排）的另一邊跳進來 */
      const frog = box.querySelector('.frog'), pc = cellOf(prev), nc = cellOf(d), w = pc.offsetWidth;
      frog.style.left = (pc.offsetLeft + dir*w*0.9) + 'px';
      later(function(){
        frog.style.transition = 'none';
        frog.style.left = (nc.offsetLeft - dir*w*0.9) + 'px'; frog.style.top = nc.offsetTop + 'px';
        void frog.offsetWidth; frog.style.transition = '';
        placeFrog(box, d, true); badge(d, step); sHop(step);
        later(go, 420);
      }, 260);
      return;
    }
    placeFrog(box, d, true); badge(d, step); sHop(step);
    later(go, reduceMotion ? 0 : 330);
  })();
}

/* ===== 提示 ===== */
function showHint(){
  clearMarks();
  let t = '';
  if(q.type==='weekday'){
    cellOf(q.d).classList.add('ring'); lightColumn(wdOf(M,q.d));
    t = '找到'+evTag(q.ev)+'那一格，順著亮起來的那一直排往上看，最上面寫的就是星期幾。';
  }else if(q.type==='nth'){
    lightColumn(q.w);
    q.list.forEach(function(d, i){ if(!q.last && i < q.n - 1) badge(d, i+1); });
    t = q.last ? '先找到'+wdName(q.w)+'那一直排（亮起來的），最下面那一格就是最後一個。'
               : '先找到'+wdName(q.w)+'那一直排（亮起來的），從上往下數：第 1 個、第 2 個……數到第 '+q.n+' 個。';
  }else if(q.type==='hop'){
    cellOf(q.from).classList.add('ring');
    const step = q.k >= 7 ? 7 : 0;
    if(step){
      const mid = q.back ? q.from - 7 : q.from + 7;
      badge(mid, '7'); placeFrog(box, q.from, false);
      t = '小秘訣：'+(q.back?'往回':'往前')+'跳 7 天，就是正'+(q.back?'上':'下')+'方那一格（標著 7 的那格）。'
        + (q.k > 7 ? '再從那裡繼續跳 '+(q.k-7)+' 天！' : '');
    }else{
      t = '從'+evTag(q.ev)+'那一格開始，'+(q.back?'往回':'往前')+'一格一格數 '+q.k+' 格。' + wrapNote(q.from, q.to);
      placeFrog(box, q.from, false);
    }
  }else if(q.type==='gap'){
    cellOf(q.a.d).classList.add('ring'); cellOf(q.b.d).classList.add('ring');
    t = '從'+evTag(q.a.e)+'那一格開始，一格一格數到'+evTag(q.b.e)+'，數了幾格就是幾天。'+(rowOf(q.a.d)!==rowOf(q.b.d)?'數到星期六後，要換到下一排的星期日繼續數。':'')+'也可以用大的日期減小的日期：'+q.b.d+' − '+q.a.d+'。';
  }
  $('hint').innerHTML = Z(t);
}
function revealAnswer(){
  clearMarks();
  if(q.type==='hop'){
    cellOf(q.from).classList.add('ring');
    hopAnim(q.from, q.to, function(){ cellOf(q.to).classList.add('right'); });
    $('hint').innerHTML = Z('看跳跳跳一次：從 '+q.from+' 號'+(q.back?'往回':'往前')+'跳 '+q.k+' 天，跳到 '+q.to+' 號，是'+wdName(wdOf(M,q.to))+'。' + wrapNote(q.from, q.to));
  }else if(q.type==='gap'){
    cellOf(q.a.d).classList.add('ring');
    hopAnim(q.a.d, q.b.d, function(){ cellOf(q.b.d).classList.add('right'); });
    $('hint').innerHTML = Z('跳跳從 '+q.a.d+' 號跳到 '+q.b.d+' 號，一共跳了 '+q.answer+' 天。');
  }else if(q.type==='weekday'){
    lightColumn(q.answer); cellOf(q.d).classList.add('right');
    $('hint').innerHTML = Z(q.d+' 號那一直排最上面寫著「'+WD[q.answer]+'」，所以是'+wdName(q.answer)+'。');
  }else{
    lightColumn(q.w);
    q.list.forEach(function(d,i){ badge(d, i+1); });
    cellOf(q.answer).classList.add('right');
    $('hint').innerHTML = Z(wdName(q.w)+'這一直排，'+(q.last?'最後一個':'第 '+q.n+' 個')+'是 '+q.answer+' 號。');
  }
}

/* ===== 作答 ===== */
function markRight(){
  if(q.kind==='cell') cellOf(q.answer).classList.add('right');
  else Array.from((q.kind==='wd'?$('wdBtns'):$('numBtns')).children).forEach(function(b){ if(+b.dataset.v===q.answer) b.classList.add('right'); });
}
function answer(v, el){
  if(locked) return;
  if(el.disabled || el.classList.contains('wrong')) return;
  if(v === q.answer){
    locked = true; clearTimers(); clearMarks(); markRight();
    results[qi] = q.retry ? 'half' : 'ok';
    sGood();
    if(q.type==='hop') placeFrog(box, q.to, true);
    $('feedback').className = 'feedback good';
    $('feedback').innerHTML = Z(q.retry ? '你自己找到答案了！' : pick(PRAISE));
    done(); return;
  }
  el.classList.add('wrong'); if(el.tagName==='BUTTON') el.disabled = true;
  sSoft();
  if(!q.retry){
    q.retry = true;
    $('feedback').className = 'feedback warm';
    $('feedback').innerHTML = Z(pick(COMFORT) + '看看提示，再試一次！');
    showHint();
  }else{
    locked = true; results[qi] = 'miss';
    markRight();
    $('feedback').className = 'feedback warm';
    $('feedback').innerHTML = Z('沒關係！跳跳演給你看');
    revealAnswer(); done();
  }
}
function done(){
  qi++; renderDots();
  $('nextBtn').innerHTML = Z(qi >= TOTAL ? '看結果' : '下一題');
  $('nextBtn').hidden = false;
}
$('nextBtn').onclick = nextQ;
$('backBtn').onclick = function(){ clearTimers(); renderHome(); show('home'); };
$('startBtn').onclick = startGame;
document.addEventListener('keydown', function(e){
  if($('game').classList.contains('active') && !$('nextBtn').hidden && (e.key==='Enter' || e.key===' ')){ e.preventDefault(); nextQ(); }
});
window.addEventListener('resize', function(){
  if($('game').classList.contains('active') && q && q.type==='hop' && !locked) placeFrog(box, q.from, false);
  if($('home').classList.contains('active')) renderPreview();
});

/* ===== 結果 ===== */
function finish(){
  const ok = results.filter(function(r){ return r==='ok'; }).length, half = results.filter(function(r){ return r==='half'; }).length;
  const pts = (ok + half*0.5)/TOTAL, stars = pts>=0.9 ? 3 : pts>=0.7 ? 2 : pts>=0.4 ? 1 : 0;
  if(!store.best[level] || stars > store.best[level]) store.best[level] = stars;
  save();
  $('resultBox').innerHTML = Z('<span class="tape"></span><div class="stars">'+[0,1,2].map(function(i){ return starSVG(i<stars); }).join('')+'</div>'
    + '<div class="r-frog">'+frogSVG()+'</div>'
    + '<div class="r-title">'+['加油，再挑戰一次！','不錯喔！','很厲害！','你是月曆小偵探！'][stars]+'</div>'
    + '<div class="r-line">'+LEVELS[level].name+'　答對 '+(ok+half)+' / '+TOTAL+' 題'+(half?'（其中 '+half+' 題看了提示）':'')+'</div>'
    + '<div class="r-btns"><button class="note-btn green" id="againBtn">再玩一次</button><button class="note-btn blue" id="homeBtn">回首頁</button></div>');
  $('againBtn').onclick = startGame;
  $('homeBtn').onclick = function(){ renderHome(); show('home'); };
  show('result');
  if(stars>=2) tone([523,659,784,1047], 0.12, 'triangle');
}

refreshZy();
</script>
